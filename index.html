<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEILBOUND — Les Enfants du Brouillard</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23000%22/%3E%3Ccircle cx=%228%22 cy=%2210%22 r=%224%22 fill=%22%23f2e6c9%22/%3E%3Cellipse cx=%224%22 cy=%226%22 rx=%223%22 ry=%222%22 fill=%22%238a6fa8%22/%3E%3Cellipse cx=%2212%22 cy=%226%22 rx=%223%22 ry=%222%22 fill=%22%238a6fa8%22/%3E%3C/svg%3E" />
    <meta name="description" content="RPG 2D d'exploration et de lien avec des créatures horrifiques originales." />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
        outline: none;
      }
      #tactile button {
        position: fixed;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 1px solid #5a5f6a;
        background: rgba(10, 11, 15, 0.55);
        color: #d9d4c7;
        font: 22px monospace;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #tactile .dpad.up { left: 76px; bottom: 136px; }
      #tactile .dpad.down { left: 76px; bottom: 16px; }
      #tactile .dpad.left { left: 16px; bottom: 76px; }
      #tactile .dpad.right { left: 136px; bottom: 76px; }
      #tactile .btn.a { right: 16px; bottom: 76px; color: #c9b458; }
      #tactile .btn.b { right: 82px; bottom: 26px; }
      #tactile .btn.menu { right: 16px; top: 16px; width: 44px; height: 44px; font-size: 18px; }
      #tactile .btn.run { right: 82px; bottom: 126px; width: 44px; height: 44px; font-size: 18px; }
      noscript {
        color: #ccc;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <canvas id="jeu" width="1280" height="720" tabindex="0" aria-label="VEILBOUND, jeu vidéo"></canvas>
    <noscript>Ce jeu nécessite JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
